version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: habit-tracker-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: habit_tracker
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: habit-tracker-backend
    ports:
      - "7070:7070"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/habit_tracker?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_PROFILES_ACTIVE: default
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: habit-tracker-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
